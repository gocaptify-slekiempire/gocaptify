<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoCaptify | Sovereign Command</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav"><div class="logo">GoCaptify</div><div id="status">Sovereign Mode: ACTIVE</div></header>
    <div class="container" id="gateway">
        <div class="card">
            <h1>Sovereign Initialization</h1>
            <input type="text" id="username" placeholder="Pick your Go-Username (e.g. SlekiEmpire)">
            <input type="password" id="pass" placeholder="Secure Password">
            <button onclick="handleLogin()">Establish Sovereignty</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
